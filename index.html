<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OKR Pilot</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--line:#e5e5df;--ink:#111;--muted:#81817a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}.side{width:235px;position:fixed;inset:0 auto 0 0;background:#111;color:#fff;padding:22px 15px}.brand{font-weight:800;font-size:20px;margin-bottom:26px;display:flex;gap:9px;align-items:center}.logo{width:32px;height:32px;border-radius:10px;background:#fff;color:#111;display:grid;place-items:center}
.ws{background:#1a1a1a;border:1px solid #2c2c2c;border-radius:14px;padding:13px;margin-bottom:18px}.ws small{color:#888}.ws b{display:block;margin:5px 0 10px}.chip{display:inline-block;background:#292929;color:#bbb;border-radius:99px;padding:5px 8px;font-size:10px}
.nav{width:100%;border:0;background:transparent;color:#aaa;text-align:right;padding:11px;border-radius:10px;margin:3px 0}.nav.active,.nav:hover{background:#222;color:#fff}.sidefoot{position:absolute;bottom:17px;color:#666;font-size:10px}
.main{margin-left:235px;width:calc(100% - 235px);padding:28px}.wrap{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:24px}.top h1{font-size:28px;margin:5px 0}.muted{color:var(--muted);font-size:11px}.actions{display:flex;gap:8px}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 13px}.btn.black{background:#111;color:#fff;border-color:#111}
.stats{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 26px #00000008}.hero{padding:20px}.big{font-size:64px;font-weight:800;line-height:1;margin:10px 0 16px}.bar{height:8px;background:#e9e9e4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#111;border-radius:99px}.stat{min-height:135px;padding:17px}.stat .num{font-size:36px;font-weight:800;margin-top:50px}
.sec{display:flex;justify-content:space-between;align-items:end;margin:32px 0 12px}.sec h2{margin:3px 0;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.obj{padding:18px}.obj.dark{background:#151515;color:#fff;border-color:#151515}.obj h3{margin:6px 0 5px;font-size:17px}.obj p{color:#777;line-height:1.8;margin:0;font-size:11px}.obj.dark p{color:#999}.owner{float:left;background:#f1f1ed;color:#666;padding:5px 8px;border-radius:99px;font-size:10px}.obj.dark .owner{background:#292929;color:#bbb}.op{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-weight:700}.kr{width:100%;background:transparent;border:0;border-top:1px solid #ededE8;padding:11px 0;display:flex;justify-content:space-between;text-align:right;color:inherit}.obj.dark .kr{border-color:#2b2b2b}.kr b{font-size:11px}.kr small{display:block;color:#85857f;margin-top:3px}.table{overflow:hidden}.thead,.row{display:grid;grid-template-columns:2.5fr 1fr 1.2fr 1fr .25fr;gap:13px;align-items:center;padding:13px 16px}.thead{background:#f8f8f5;color:#888;font-size:10px}.row{width:100%;background:#fff;border:0;border-bottom:1px solid #eee;text-align:right;font-size:11px}.mini{height:6px;width:80px;background:#e9e9e4;border-radius:99px;display:inline-block;overflow:hidden;vertical-align:middle}.mini i{display:block;height:100%;background:#111}.status{font-size:10px;padding:5px 8px;background:#f0f0ec;border-radius:99px}.empty{padding:30px;color:#888;text-align:center}
.modalbg{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px}.modal{width:min(560px,100%);background:#fff;border-radius:18px;padding:20px}.mh{display:flex;justify-content:space-between;align-items:start}.x{width:32px;height:32px;border:0;background:#f0f0ec;border-radius:9px}.form{display:grid;gap:12px;margin-top:15px}.form label{font-size:11px;color:#555}.form input,.form textarea,.form select{width:100%;display:block;margin-top:6px;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff}.form textarea{min-height:84px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{background:#f4f4f0;border-radius:13px;padding:14px;margin-top:12px}.check .p{font-size:38px;font-weight:800}
@media(max-width:900px){.side{width:205px}.main{margin-left:205px;width:calc(100% - 205px)}.stats{grid-template-columns:1fr 1fr}.hero{grid-column:1/-1}.grid{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.side{position:static;width:100%}.main{margin:0;width:100%;padding:18px}.top{display:block}.actions{margin-top:12px}.stats{grid-template-columns:1fr 1fr}.thead{display:none}.row{grid-template-columns:1fr 1fr;gap:8px}.row span:nth-child(3),.row span:nth-child(4){text-align:left}}
</style>
</head>
<body><div id="app"></div>
<script>const SUPABASE_URL='https://jcpdzqilnhnljvrfsjug.supabase.co';
const SUPABASE_KEY='sb_publishable_IsYn6XHFo7AUOfE0BDyfZA_sjavx6Vr';
const DB={workspace:'okr_workspaces',cycle:'okr_cycles',objective:'okr_objectives',kr:'okr_key_results',action:'okr_actions',checkin:'okr_check_ins'};
const CACHE_KEY='okr-pilot-cache';
const seed={workspace:'دارکو',cycle:{name:'چرخه ۰۱ • مهر ۱۴۰۵',start:'۱۴۰۵/۰۷/۰۱',end:'۱۴۰۵/۰۸/۰۱'},objectives:[],actions:[]};
let state=JSON.parse(localStorage.getItem(CACHE_KEY)||'null')||seed,view='dashboard',modal=null,selected=null,dbConnected=false,dbSyncing=false,dbLoading=true;
const $=s=>document.querySelector(s),pct=(a,b)=>Math.min(100,Math.max(0,Math.round((+a/+b)*100)));
const statusName=s=>({on:'در مسیر',risk:'در معرض خطر',behind:'عقب‌مانده'}[s]||s);
const actName=s=>({planned:'برنامه‌ریزی‌شده',progress:'در حال انجام',done:'انجام‌شده',overdue:'معوق'}[s]||s);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function faDate(iso){if(!iso)return '';try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso+'T12:00:00'))}catch{return iso}}
function headers(extra={}){return {apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,Accept:'application/json','Content-Type':'application/json',...extra}}
async function req(path,opts={}){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opts,headers:headers(opts.headers||{})});if(!r.ok){let m='خطای پایگاه داده';try{const j=await r.json();m=j.message||j.hint||j.details||m}catch{}throw new Error(m)}const t=await r.text();return t?JSON.parse(t):[]}
async function get(table,q){return req(table+'?'+q)}
async function upsert(table,rows){if(!rows.length)return;return req(table,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)})}
async function loadFromDb(){const [ws,cy,objs,krRows,acts]=await Promise.all([get(DB.workspace,'id=eq.ws-darco&select=*'),get(DB.cycle,'id=eq.cycle-01&select=*'),get(DB.objective,'cycle_id=eq.cycle-01&select=*&order=created_at.asc'),get(DB.kr,'select=*&order=created_at.asc'),get(DB.action,'select=*&order=created_at.desc')]);if(!ws.length||!cy.length)throw new Error('ساختار OKR در دیتابیس پیدا نشد');const map={};for(const o of objs)map[o.id]=[];for(const k of krRows)(map[k.objective_id]??=[]).push({id:k.id,title:k.title,cur:+k.current_value,target:+k.target_value,unit:k.unit||'',owner:k.owner||'نامشخص',status:k.status||'on'});const krTitle=Object.fromEntries(krRows.map(k=>[k.id,k.title]));return{workspace:ws[0].name,cycle:{name:cy[0].name,start:faDate(cy[0].start_date),end:faDate(cy[0].end_date)},objectives:objs.map(o=>({id:o.id,title:o.title,desc:o.description||'',owner:o.owner||'مدیر',dark:!!o.dark,krs:map[o.id]||[]})),actions:acts.map(a=>({id:a.id,title:a.title,owner:a.owner||'نامشخص',due:a.due_date||'',status:a.status||'planned',barrier:a.barrier||'',nextAction:a.next_action||'',krId:a.key_result_id||'',krTitle:krTitle[a.key_result_id]||'بدون اتصال'}))}}
async function syncToDb(){if(!dbConnected||dbSyncing)return;dbSyncing=true;try{await upsert(DB.workspace,[{id:'ws-darco',name:state.workspace}]);await upsert(DB.cycle,[{id:'cycle-01',workspace_id:'ws-darco',name:'چرخه ۰۱ • مهر ۱۴۰۵',start_date:'2026-09-23',end_date:'2026-10-23'}]);await upsert(DB.objective,state.objectives.map(o=>({id:o.id,cycle_id:'cycle-01',title:o.title,description:o.desc||'',owner:o.owner||'مدیر',dark:!!o.dark,updated_at:new Date().toISOString()})));await upsert(DB.kr,krs().map(k=>({id:k.id,objective_id:k.objId,title:k.title,current_value:+k.cur||0,target_value:Math.max(1,+k.target||1),unit:k.unit||'',owner:k.owner||'نامشخص',status:k.status||'on',updated_at:new Date().toISOString()})));await upsert(DB.action,(state.actions||[]).map(a=>({id:a.id,key_result_id:a.krId||null,title:a.title,owner:a.owner||'نامشخص',due_date:a.due||null,status:a.status||'planned',barrier:a.barrier||'',next_action:a.nextAction||'',updated_at:new Date().toISOString()})));localStorage.setItem(CACHE_KEY,JSON.stringify(state))}catch(e){console.error(e);dbConnected=false;localStorage.setItem(CACHE_KEY,JSON.stringify(state))}finally{dbSyncing=false;render()}}
function save(){localStorage.setItem(CACHE_KEY,JSON.stringify(state));render();syncToDb()}
async function initDb(){try{state=await loadFromDb();dbConnected=true}catch(e){console.error(e);dbConnected=false}dbLoading=false;render()}
function krs(){return state.objectives.flatMap(o=>o.krs.map(k=>({...k,objId:o.id,obj:o.title})))}
function getKr(id){for(const o of state.objectives){const k=o.krs.find(x=>x.id===id);if(k)return k}}
function getAction(id){return (state.actions||[]).find(a=>a.id===id)}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function setView(v){view=v;modal=null;selected=null;render()}
function open(m,id=null){modal=m;selected=id;render()}
function close(){modal=null;selected=null;render()}
function objectiveCard(o){const p=o.krs.length?Math.round(o.krs.reduce((a,k)=>a+pct(k.cur,k.target),0)/o.krs.length):0;return `<div class="card obj ${o.dark?"dark":""}"><span class="owner">${esc(o.owner)}</span><div class="muted">هدف</div><h3>${esc(o.title)}</h3><p>${esc(o.desc)}</p><div class="op"><span>${p}%</span><div class="bar" style="flex:1"><i style="width:${p}%"></i></div></div>${o.krs.map(k=>`<button class="kr" onclick="open('editkr','${k.id}')"><span><b>${esc(k.title)}</b><small>${esc(k.owner)}</small></span><span><span class="dot"></span>${pct(k.cur,k.target)}% ←</span></button>`).join("")}</div>`}
function dashboard(){const ks=krs(),t=ks.length?Math.round(ks.reduce((a,k)=>a+pct(k.cur,k.target),0)/ks.length):0,on=ks.filter(k=>k.status==="on").length,ri=ks.filter(k=>k.status==="risk").length,be=ks.filter(k=>k.status==="behind").length;return `<div class="stats"><div class="card hero"><div class="muted">پیشرفت کلی</div><div class="big">${t}%</div><div class="bar"><i style="width:${t}%"></i></div></div><div class="card stat"><div class="muted">در مسیر</div><div class="num">${on}</div></div><div class="card stat"><div class="muted">در معرض خطر</div><div class="num">${ri}</div></div><div class="card stat"><div class="muted">عقب‌مانده</div><div class="num">${be}</div></div></div><div class="sec"><div><div class="muted">چرخه فعلی</div><h2>اهداف</h2></div><div class="muted">${state.objectives.length} هدف</div></div><div class="grid">${state.objectives.map(objectiveCard).join("")}</div>`}
function objectives(){return `<div class="sec" style="margin-top:0"><div><div class="muted">مدیریت</div><h2>اهداف</h2></div></div><div class="grid">${state.objectives.map(o=>`<button class="card obj ${o.dark?"dark":""}" onclick="open('editobj','${o.id}')"><span class="owner">${esc(o.owner)}</span><div class="muted">هدف</div><h3>${esc(o.title)}</h3><p>${esc(o.desc)}</p><div style="margin-top:15px" class="muted">${o.krs.length} نتیجه کلیدی</div></button>`).join("")}</div>`}
function krsView(){const ks=krs();return `<div class="sec" style="margin-top:0"><div><div class="muted">مدیریت</div><h2>نتایج کلیدی</h2></div></div><div class="card table"><div class="thead"><span>نتیجه کلیدی</span><span>مسئول</span><span>پیشرفت</span><span>وضعیت</span><span></span></div>${ks.map(k=>`<button class="row" onclick="open('editkr','${k.id}')"><span><b>${esc(k.title)}</b><small style="display:block;color:#888;margin-top:3px">${esc(k.obj)}</small></span><span>${esc(k.owner)}</span><span><i class="mini"><i style="width:${pct(k.cur,k.target)}%"></i></i> ${pct(k.cur,k.target)}%</span><span><i class="status">${statusName(k.status)}</i></span><span>←</span></button>`).join("")}</div>`}
function actionsView(){const as=state.actions||[];return `<div class="sec" style="margin-top:0"><div><div class="muted">اجرا</div><h2>پیگیری اقدام‌ها</h2></div><button class="btn black" onclick="open('action')">＋ اقدام جدید</button></div><div class="card table"><div class="thead"><span>اقدام</span><span>مسئول اقدام</span><span>مهلت</span><span>وضعیت</span><span></span></div>${as.length?as.map(a=>`<button class="row" onclick="open('editaction','${a.id}')"><span><b>${esc(a.title)}</b><small style="display:block;color:#888;margin-top:3px">${esc(a.krTitle||"بدون KR")}</small></span><span>${esc(a.owner||"نامشخص")}</span><span>${esc(a.due||"بدون مهلت")}</span><span><i class="status">${actName(a.status)}</i></span><span>←</span></button>`).join(""):`<div class="empty">هنوز اقدامی ثبت نشده است.</div>`}</div>`}
function actionForm(a){a=a||{title:"",owner:"",due:"",status:"planned",krId:"",barrier:"",nextAction:""};return `<label>نتیجه کلیدی مرتبط<select id="ak"><option value="">بدون اتصال</option>${krs().map(k=>`<option value="${k.id}" ${k.id===a.krId?"selected":""}>${esc(k.title)}</option>`).join("")}</select></label><label>اقدام<input id="at" required value="${esc(a.title)}" placeholder="مثلاً تماس با ۲۰ مشتری قدیمی"></label><div class="two"><label>مسئول اقدام<input id="ao" value="${esc(a.owner)}"></label><label>مهلت<input id="ad" type="date" value="${esc(a.due)}"></label></div><label>وضعیت<select id="as"><option value="planned" ${a.status==="planned"?"selected":""}>برنامه‌ریزی‌شده</option><option value="progress" ${a.status==="progress"?"selected":""}>در حال انجام</option><option value="done" ${a.status==="done"?"selected":""}>انجام‌شده</option><option value="overdue" ${a.status==="overdue"?"selected":""}>معوق</option></select></label><label>موانع<textarea id="ab">${esc(a.barrier)}</textarea></label><label>اقدام بعدی<textarea id="an">${esc(a.nextAction)}</textarea></label>`}
function modalHtml(){if(!modal)return"";if(modal==="action")return `<div class="modalbg"><div class="modal"><div class="mh"><div><div class="muted">پیگیری اجرا</div><h2>اقدام جدید</h2></div><button class="x" onclick="close()">×</button></div><form class="form" onsubmit="addAction(event)">${actionForm()}<button class="btn black">ثبت اقدام</button></form></div></div>`;if(modal==="editaction"){const a=getAction(selected);return `<div class="modalbg"><div class="modal"><div class="mh"><div><div class="muted">پیگیری اجرا</div><h2>ویرایش اقدام</h2></div><button class="x" onclick="close()">×</button></div><form class="form" onsubmit="editAction(event)">${actionForm(a)}<button class="btn black">ذخیره تغییرات</button></form></div></div>`}if(modal==="editobj"){const o=state.objectives.find(x=>x.id===selected);return `<div class="modalbg"><div class="modal"><div class="mh"><div><div class="muted">مدیریت هدف</div><h2>ویرایش هدف</h2></div><button class="x" onclick="close()">×</button></div><form class="form" onsubmit="editObj(event)"><label>عنوان<input id="ot" required value="${esc(o.title)}"></label><label>توضیح<textarea id="od">${esc(o.desc)}</textarea></label><label>مسئول<input id="oo" value="${esc(o.owner)}"></label><button class="btn black">ذخیره تغییرات</button></form></div></div>`}if(modal==="editkr"){const k=getKr(selected);const p=state.objectives.find(o=>o.krs.some(x=>x.id===selected));return `<div class="modalbg"><div class="modal"><div class="mh"><div><div class="muted">مدیریت KR</div><h2>ویرایش نتیجه کلیدی</h2></div><button class="x" onclick="close()">×</button></div><form class="form" onsubmit="editKr(event)"><label>هدف<select id="ko">${state.objectives.map(o=>`<option value="${o.id}" ${o.id===p.id?"selected":""}>${esc(o.title)}</option>`).join("")}</select></label><label>عنوان KR<input id="kt" required value="${esc(k.title)}"></label><div class="two"><label>مقدار فعلی<input id="kc" type="number" min="0" value="${k.cur}"></label><label>مقدار هدف<input id="kg" type="number" min="1" value="${k.target}"></label></div><div class="two"><label>واحد<input id="ku" value="${esc(k.unit)}"></label><label>مسئول<input id="kw" value="${esc(k.owner)}"></label></div><label>وضعیت<select id="ks"><option value="on" ${k.status==="on"?"selected":""}>در مسیر</option><option value="risk" ${k.status==="risk"?"selected":""}>در معرض خطر</option><option value="behind" ${k.status==="behind"?"selected":""}>عقب‌مانده</option></select></label><div class="actions"><button class="btn" type="button" onclick="open('checkin','${k.id}')">ثبت پیشرفت سریع</button><button class="btn black">ذخیره تغییرات</button></div></form></div></div>`}if(modal==="checkin"){const k=getKr(selected);return `<div class="modalbg"><div class="modal"><div class="mh"><div><div class="muted">ثبت پیشرفت</div><h2>${esc(k.title)}</h2></div><button class="x" onclick="close()">×</button></div><div class="check"><div class="p">${pct(k.cur,k.target)}%</div><div>${k.cur} / ${k.target} ${esc(k.unit)}</div></div><form class="form" onsubmit="checkinSave(event)"><label>مقدار فعلی<input id="cc" type="number" min="0" value="${k.cur}"></label><label>وضعیت<select id="cs"><option value="on" ${k.status==="on"?"selected":""}>در مسیر</option><option value="risk" ${k.status==="risk"?"selected":""}>در معرض خطر</option><option value="behind" ${k.status==="behind"?"selected":""}>عقب‌مانده</option></select></label><button class="btn black">ثبت پیشرفت</button></form></div></div>`}if(modal==="newobj")return `<div class="modalbg"><div class="modal"><div class="mh"><div><div class="muted">مدیریت</div><h2>هدف جدید</h2></div><button class="x" onclick="close()">×</button></div><form class="form" onsubmit="addObj(event)"><label>عنوان<input id="ot" required></label><label>توضیح<textarea id="od"></textarea></label><label>مسئول<input id="oo"></label><button class="btn black">ساخت هدف</button></form></div></div>`;return `<div class="modalbg"><div class="modal"><div class="mh"><div><div class="muted">مدیریت</div><h2>نتیجه کلیدی جدید</h2></div><button class="x" onclick="close()">×</button></div><form class="form" onsubmit="addKr(event)"><label>هدف<select id="ko">${state.objectives.map(o=>`<option value="${o.id}">${esc(o.title)}</option>`).join("")}</select></label><label>عنوان KR<input id="kt" required></label><div class="two"><label>مقدار فعلی<input id="kc" type="number" value="0"></label><label>مقدار هدف<input id="kg" type="number" min="1" required></label></div><div class="two"><label>واحد<input id="ku"></label><label>مسئول<input id="kw"></label></div><label>وضعیت<select id="ks"><option value="on">در مسیر</option><option value="risk">در معرض خطر</option><option value="behind">عقب‌مانده</option></select></label><button class="btn black">ساخت نتیجه کلیدی</button></form></div></div>`}
function addObj(e){e.preventDefault();state.objectives.push({id:crypto.randomUUID(),title:$("#ot").value.trim(),desc:$("#od").value.trim(),owner:$("#oo").value.trim()||"مدیر",dark:false,krs:[]});save()}
function editObj(e){e.preventDefault();const o=state.objectives.find(x=>x.id===selected);o.title=$("#ot").value.trim();o.desc=$("#od").value.trim();o.owner=$("#oo").value.trim()||"مدیر";save()}
function addKr(e){e.preventDefault();const o=state.objectives.find(x=>x.id===$("#ko").value);o.krs.push({id:crypto.randomUUID(),title:$("#kt").value.trim(),cur:+$("#kc").value||0,target:Math.max(1,+$("#kg").value||1),unit:$("#ku").value.trim(),owner:$("#kw").value.trim()||"نامشخص",status:$("#ks").value});save()}
function editKr(e){e.preventDefault();const k=getKr(selected),old=state.objectives.find(o=>o.krs.some(x=>x.id===selected)),n=state.objectives.find(o=>o.id===$("#ko").value);k.title=$("#kt").value.trim();k.cur=+$("#kc").value||0;k.target=Math.max(1,+$("#kg").value||1);k.unit=$("#ku").value.trim();k.owner=$("#kw").value.trim()||"نامشخص";k.status=$("#ks").value;if(old.id!==n.id){old.krs=old.krs.filter(x=>x.id!==selected);n.krs.push(k)}save()}
function checkinSave(e){e.preventDefault();const k=getKr(selected);k.cur=+$("#cc").value||0;k.status=$("#cs").value;save()}
function addAction(e){e.preventDefault();const a={id:crypto.randomUUID(),title:"",owner:"",due:"",status:"planned",barrier:"",nextAction:"",krId:"",krTitle:""};writeAction(a);state.actions.push(a);save()}
function editAction(e){e.preventDefault();const a=getAction(selected);writeAction(a);save()}
function writeAction(a){a.title=$("#at").value.trim();a.owner=$("#ao").value.trim()||"نامشخص";a.due=$("#ad").value;a.status=$("#as").value;a.barrier=$("#ab").value.trim();a.nextAction=$("#an").value.trim();a.krId=$("#ak").value;a.krTitle=krs().find(k=>k.id===a.krId)?.title||"بدون KR"}
function statusBadge(){return dbLoading?'در حال اتصال به دیتابیس…':dbConnected?'● متصل به Supabase':'● حالت موقت'}
function render(){const title=view==="dashboard"?"مرکز فرمان":view==="objectives"?"اهداف":view==="krs"?"نتایج کلیدی":"پیگیری اقدام‌ها";$("#app").innerHTML=`<div class="app"><aside class="side"><div class="brand"><span class="logo">O</span>OKR Pilot</div><div class="ws"><small>فضای کاری</small><b>${esc(state.workspace)}</b><span class="chip">${esc(state.cycle.name)}</span><small style="display:block;margin-top:8px;color:#999">${statusBadge()}</small></div><button class="nav ${view==="dashboard"?"active":""}" onclick="setView('dashboard')">داشبورد</button><button class="nav ${view==="objectives"?"active":""}" onclick="setView('objectives')">اهداف</button><button class="nav ${view==="krs"?"active":""}" onclick="setView('krs')">نتایج کلیدی</button><button class="nav ${view==="actions"?"active":""}" onclick="setView('actions')">پیگیری اقدام‌ها</button><div class="sidefoot">نسخه MVP</div></aside><main class="main"><div class="wrap"><div class="top"><div><div class="muted">${state.cycle.start} → ${state.cycle.end}</div><h1>${title}</h1></div><div class="actions"><button class="btn" onclick="open('newobj')">＋ هدف جدید</button><button class="btn black" onclick="open('newkr')">＋ نتیجه کلیدی جدید</button></div></div>${view==="dashboard"?dashboard():view==="objectives"?objectives():view==="krs"?krsView():actionsView()}</div></main>${modalHtml()}</div>`}
render()

initDb();
</script>
</body>
</html>
